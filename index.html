  --novo:#F0BE6A;--novo-bg:#463212;--conf:#B4C4CB;--conf-bg:#2A3D46;--alerta:#F49C8B;--alerta-bg:#4D2118;
  --side:#08161C;--side2:#14303B;color-scheme:dark}}

th button{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}th .ar{font-size:11px;color:var(--muted);opacity:.5}th .ar.on{opacity:1;color:var(--accent)}th button:hover .ar{opacity:1}
.obsb{all:unset;box-sizing:border-box;display:block;width:220px;min-height:30px;padding:5px 8px;border:1px dashed var(--line);border-radius:6px;cursor:pointer;font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg)}
.obsb:hover,.obsb:focus-visible{border-color:var(--accent);border-style:solid;outline:none}.obsb .mono{color:var(--muted)}.obsn{font-size:11px;color:var(--accent);font-weight:600}

#obsbox[hidden]{display:none}.ob-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.ob-h b{display:block;font:600 15px var(--f-disp)}.ob-h .mono{font-size:11.5px;color:var(--muted);white-space:normal}.ob-h button{min-height:32px;width:32px;padding:0;font-size:18px;line-height:1}

app.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.f==='navio')navFill(e.target);if(e.target.id==='navq'){S.nq=e.target.value;redraw()}if(e.target.id==='q'){S.q=e.target.value;S.pg=0;redraw()}});
app.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.rid){const x=RULES.find(y=>y.id===t.dataset.rid),c=S.rc[x.id]||(S.rc[x.id]={}),k=t.dataset.rk;if(k==='on'){c.on=t.checked;S.log.unshift({q:nowBr(),r:'Regra',f:x.l,a:t.checked?'Desativada':'Ativa',b:t.checked?'Ativa':'Desativada'})}else{const n=Number(t.value);if(t.value===''||!Number.isInteger(n)||n<0){S.msg='Prazo: informe um número inteiro igual ou maior que zero.';redraw();return}const a=rc(x.id).days;c.days=n;S.log.unshift({q:nowBr(),r:'Regra',f:x.l,a:a+' dias',b:n+' dias'})}save();redraw();return}
  if(t.dataset.dc){S.dc.num=t.checked;S.log.unshift({q:nowBr(),r:'Regra',f:'Numerário indica digitado',a:t.checked?'Não':'Sim',b:t.checked?'Sim':'Não'});save();redraw();return}if(t.dataset.dcf){const k=t.dataset.dcf;S.dc.campos=t.checked?[...S.dc.campos,k]:S.dc.campos.filter(x=>x!==k);S.log.unshift({q:nowBr(),r:'Regra',f:'Campo mínimo: '+F.find(x=>x.k===k).l,a:t.checked?'Fora':'Dentro',b:t.checked?'Dentro':'Fora'});save();redraw();return}if(t.dataset.df){S.df[t.dataset.df]=t.value;redraw();return}if(t.id==='navfile'){if(t.files[0])readNavFile(t.files[0]);return}if(t.id==='file'){if(t.files[0])readFile(t.files[0]);return}
  if(t.id==='fan'){S.an=t.value;S.pg=0;redraw();return}if(t.id==='fca'){S.ca=t.value;S.pg=0;redraw();return}if(t.id==='fdg'){S.dgf=t.checked;S.pg=0;redraw();return}if(t.id==='fpe'){S.pe=t.checked;S.pg=0;redraw();return}
  if(t.dataset.m){S.map.sel[t.dataset.m]=t.value;S.err='';redraw();return}
  if(t.tagName==='SELECT')commit(t)});
app.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.f==='navio')navFill(e.target)});
app.addEventListener('focusout',e=>{const t=e.target;if(t.tagName==='INPUT'&&(t.dataset.e!==undefined||t.dataset.c!==undefined))commit(t)});
app.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.tagName==='INPUT'&&(t.dataset.e!==undefined||t.dataset.c!==undefined))t.blur()});
app.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});

document.addEventListener('keydown',e=>{if(S.ck&&e.key==='Escape'){S.ck=null;redraw();return}if(S.menu&&e.key==='Escape'){S.menu=false;redraw();return}if(S.navPend&&e.key==='Escape'){S.navPend=null;redraw();return}const p=document.getElementById('pop');if(!p)return;if(e.key==='Escape'){S.pop=false;const f=document.activeElement;if(f)f.blur();redraw();return}if(e.key==='Tab'){const it=[...p.querySelectorAll('select,input,button')];if(!it.length)return;const a=it[0],z=it[it.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
const tip=document.createElement('div');tip.id='tip';tip.hidden=true;tip.setAttribute('role','tooltip');document.body.appendChild(tip);
const tipPos=(x,y)=>{const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+12))+'px';tip.style.top=Math.max(8,y-h-10)+'px'};
app.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;tipPos(e.clientX,e.clientY)});

app.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&t.matches(':focus-visible')){tip.textContent=t.dataset.tip;tip.hidden=false;const r=t.getBoundingClientRect();tipPos(r.left,r.top)}});

const obsBox=document.createElement('div');obsBox.id='obsbox';obsBox.hidden=true;obsBox.setAttribute('role','dialog');obsBox.setAttribute('aria-label','Observação');document.body.appendChild(obsBox);
let obsCode=null,obsT=null,obsDraft={d:'',t:''};const hoverOk=matchMedia('(hover:hover) and (pointer:fine)');
function obsAnchor(){return obsCode?document.querySelector(`[data-obs="${CSS.escape(obsCode)}"]`):null}
function obsPlace(){const a=obsAnchor();if(innerWidth<=760){obsBox.classList.add('sheet');obsBox.style.left=obsBox.style.top='';return}obsBox.classList.remove('sheet');if(!a){obsClose();return}const r=a.getBoundingClientRect(),w=obsBox.offsetWidth,h=obsBox.offsetHeight;if(r.bottom<0||r.top>innerHeight){obsClose();return}obsBox.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left))+'px';obsBox.style.top=(r.bottom+6+h<innerHeight?r.bottom+6:Math.max(8,r.top-h-6))+'px'}
function obsRender(){const r=S.rows.find(x=>x.codigo===obsCode);if(!r){obsClose();return}const n=notas(r);
  obsBox.innerHTML=`<div class="ob-h"><div><b>Observação</b><span class="mono">${esc(r.codigo)} · ${esc(val(r,'importador'))}</span></div><button data-ob="x" aria-label="Fechar">×</button></div><div class="ob-l">${n.length?n.map(x=>`<div class="ob-i"><span class="mono" title="${x.d?br(x.d):'Sem data'}">${x.d?br(x.d).slice(0,5):'—'}</span><span>${esc(x.t)}</span></div>`).join(''):'<p class="note">Nenhuma anotação ainda.</p>'}</div><form class="ob-f" novalidate><label class="vis" for="obd">Data</label><input id="obd" type="date" value="${obsDraft.d||hoje()}"><label class="vis" for="obt">Anotação</label><input id="obt" value="${esc(obsDraft.t)}" placeholder="Ag. resposta do cliente" autocomplete="off"><button class="pri" type="submit">Adicionar</button></form><p class="err" id="obe" role="alert"></p>`}
function obsOpen(code,anchor,foco){clearTimeout(obsT);if(obsCode!==code){obsCode=code;obsDraft={d:'',t:''};obsRender()}obsBox.hidden=false;obsPlace();if(foco){const t=document.getElementById('obt');if(t)t.focus()}}
function obsClose(){clearTimeout(obsT);obsBox.hidden=true;obsCode=null}
function obsLater(){clearTimeout(obsT);obsT=setTimeout(()=>{if(!obsBox.contains(document.activeElement)&&!obsBox.matches(':hover'))obsClose()},350)}
app.addEventListener('mouseover',e=>{if(!hoverOk.matches)return;const a=e.target.closest&&e.target.closest('[data-obs]');if(!a)return;clearTimeout(obsT);if(obsCode===a.dataset.obs&&!obsBox.hidden)return;if(obsCode&&obsBox.contains(document.activeElement)&&obsDraft.t)return;obsT=setTimeout(()=>obsOpen(a.dataset.obs,a,false),280)});
app.addEventListener('mouseout',e=>{const a=e.target.closest&&e.target.closest('[data-obs]');if(a&&!a.contains(e.relatedTarget))obsLater()});
obsBox.addEventListener('mouseenter',()=>clearTimeout(obsT));obsBox.addEventListener('mouseleave',obsLater);
obsBox.addEventListener('input',e=>{if(e.target.id==='obt'){obsDraft.t=e.target.value;document.getElementById('obe').textContent=''}if(e.target.id==='obd')obsDraft.d=e.target.value});
obsBox.addEventListener('click',e=>{if(e.target.closest('[data-ob="x"]'))obsClose()});
obsBox.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){const c=obsCode;obsClose();const a=document.querySelector(`[data-obs="${CSS.escape(c)}"]`);if(a)a.focus()}});
obsBox.addEventListener('submit',e=>{e.preventDefault();const r=S.rows.find(x=>x.codigo===obsCode);if(!r)return;const t=document.getElementById('obt').value.trim(),d=document.getElementById('obd').value||hoje();if(!t){document.getElementById('obe').textContent='Escreva a anotação antes de adicionar.';document.getElementById('obt').focus();return}const m=M(r);m.__obs=[...(m.__obs||[]),{d,t,q:nowBr()}].sort((a,b)=>(a.d||'').localeCompare(b.d||''));S.log.unshift({q:nowBr(),r:r.codigo,f:'Observação',a:'',b:br(d)+' – '+t});save();obsDraft={d:'',t:''};redraw();obsRender();obsPlace();document.getElementById('obt').focus()});
document.addEventListener('mousedown',e=>{if(!obsBox.hidden&&!obsBox.contains(e.target)&&!(e.target.closest&&e.target.closest('[data-obs]')))obsClose()});
addEventListener('scroll',()=>{if(!obsBox.hidden)obsPlace()},true);addEventListener('resize',()=>{if(!obsBox.hidden)obsPlace()});
